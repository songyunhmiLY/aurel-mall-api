# 集成测试专用环境。只起 MySQL 和 Redis，不起 API 进程。
# 用法：docker compose -f docker-compose.test.yml up -d
# 端口与开发环境错开（3307 / 6380），可同时运行开发栈。

name: aurel-mall-test

services:
  mysql-test:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_DATABASE: aurel_mall_test
      MYSQL_USER: aurel
      MYSQL_PASSWORD: aurel_test_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3307:3306'
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis-test:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mysql_test_data:
  redis_test_data:
